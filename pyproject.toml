[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kaitiaki-carbon"
version = "0.1.0"
description = "Carbon estimation for whenua tōpū — iwi-attested biomass and stored carbon from forest-inventory-style data."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "Anamata Kāhui Limited", email = "dev@anamatakahui.co.nz" },
]
keywords = [
    "carbon",
    "forestry",
    "indigenous",
    "maori",
    "biomass",
    "new-zealand",
    "fma",
    "ets",
    "care",
    "data-sovereignty",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Sociology",
]
dependencies = [
    "click>=8.1",
    "polars>=0.20",
    "duckdb>=0.10",
    "pydantic>=2.5",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "mypy>=1.7",
    "ruff>=0.1",
    "pre-commit>=3.5",
    "types-requests",
]
ndvi = [
    "rasterio>=1.3",
    "numpy>=1.24",
]
nz-ets = [
    "requests>=2.31",
    "pydantic-extra-types>=2.0",
]

[project.urls]
Homepage = "https://github.com/AnamataKahui/kaitiaki-carbon"
Repository = "https://github.com/AnamataKahui/kaitiaki-carbon"
Issues = "https://github.com/AnamataKahui/kaitiaki-carbon/issues"
"Anamata Kāhui Platform" = "https://github.com/LaFinnix/anamata-kahui"
"Anamata Kāhui Funding Archive" = "https://github.com/LaFinnix/anamata-funding"

[project.scripts]
kaitiaki-carbon = "kaitiaki_carbon.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kaitiaki_carbon"]
include = [
    "src/kaitiaki_carbon/nsvb/data/*.csv",
    "src/kaitiaki_carbon/nsvb/data/*.md",
    "src/kaitiaki_carbon/i18n/*.json",
]

[tool.hatch.build.targets.wheel.force-include]
"src/kaitiaki_carbon/nsvb/data" = "kaitiaki_carbon/nsvb/data"
"src/kaitiaki_carbon/i18n" = "kaitiaki_carbon/i18n"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests that need a network or fixtures",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
